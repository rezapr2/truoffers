# Serves backend/test/fixtures/sites/<host>/ for the Docker end-to-end run, the way
# backend/test/helpers/fixture-server.ts does in the test suite. Local E2E only.
log_format fixture '$host "$request" $status "$http_user_agent"';

server {
  listen 80 default_server;
  server_name ~^(?<site>[a-z0-9-]+\.test)$;
  access_log /dev/stdout fixture;
  root /sites/$site;
  index index.html;

  location / {
    rewrite ^(/.+)/$ $1 last;
    try_files $uri $uri.html $uri/index.html =404;
    # Fixture files write same-site absolute URLs as {{origin}}.
    sub_filter_types text/plain text/xml application/xml application/json;
    sub_filter '{{origin}}' 'http://$host';
    sub_filter ':{{port}}' '';
    sub_filter_once off;
  }
}
