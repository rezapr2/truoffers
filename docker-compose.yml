name: truoffers

# The VPS never builds — it pulls prebuilt images from GHCR.
# Build and publish them from a machine with real RAM: ./build-and-push.sh
# (or let .github/workflows/build-images.yml do it on push to main).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Deliberately no published ports: Mongo is only reachable from the
    # internal compose network, never from the public internet.
    healthcheck:
      # Deliberately NOT mongosh: it's a full Node.js app that needs seconds and
      # ~100MB+ just to launch, so on a small/slow VPS every probe times out and
      # a perfectly healthy mongod is reported unhealthy forever. A standalone
      # mongod only opens its TCP listener after startup + journal recovery
      # finish, so "port accepts a connection" IS the readiness signal.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
      # After an unclean shutdown, WiredTiger replays its journal before
      # accepting connections. On a small VPS that can take several minutes, and
      # a short start_period marks Mongo unhealthy mid-recovery -- which aborts
      # the deploy, recreates the container, and corrupts the shutdown again on
      # the next attempt. A generous window costs nothing: a healthy check during
      # start_period passes immediately.
      start_period: 240s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The scraper's job queue (BullMQ). AOF keeps queued jobs across restarts. noeviction is required:
    # evicting a queue key under memory pressure would silently lose jobs, so Redis refuses writes instead.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    # Like Mongo: no published ports, internal network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY:-ghcr.io/rezapr2}/truoffers-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/truoffers
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - generate one with 'openssl rand -hex 32'}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${SITE_URL:?set SITE_URL in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      # Started, not healthy: the site keeps working if Redis is down; only the scraper stops.
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    # The website crawler: same image as the API, different entrypoint. It is the only process that
    # fetches third-party pages; the API just queues work and reviews results.
    image: ${REGISTRY:-ghcr.io/rezapr2}/truoffers-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/main-worker"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/truoffers
      REDIS_URL: redis://redis:6379
      # The bot's User-Agent links to ${SITE_URL}/bot.
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCRAPER_AI_MODEL: ${SCRAPER_AI_MODEL:-claude-opus-5}
      # Keep V8's heap under the container limit so it collects garbage before the kernel kills it.
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Passes while the worker's heartbeat key in Redis is fresh (written every 10s, expires after 30s).
      test: ["CMD", "node", "dist/worker-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    # NEXT_PUBLIC_* values are baked into this image at BUILD time, so the
    # public SITE_URL must be set when building, not here.
    image: ${REGISTRY:-ghcr.io/rezapr2}/truoffers-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-rendered pages call the API directly over the internal network
      INTERNAL_API_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
