name: Build and publish images

# Builds the production images on GitHub's runners (native amd64, free),
# publishes them to GHCR, then SSHes to the VPS to run ./deploy.sh so the
# new images actually go live. The deploy key is scoped: the VPS's
# authorized_keys forces it to run only `cd /srv/truoffers && ./deploy.sh`,
# so a leaked key can't be used for anything else.
#
# Required repo settings (Settings -> Secrets and variables -> Actions -> Variables):
#   SITE_URL           e.g. https://truoffers.co.uk   (baked into the frontend)
#   GOOGLE_CLIENT_ID   optional
#   APPLE_CLIENT_ID    optional
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DEPLOY_SSH_KEY     private half of the dedicated github-actions-deploy keypair
#   DEPLOY_HOST        the VPS's IP or hostname
#   DEPLOY_USER        the SSH user on the VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          # Chromium rendering worker (Phase 3); runs only where the host has the memory for it.
          - name: render
            context: ./backend
            file: ./backend/Dockerfile.render
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/truoffers-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          # NEXT_PUBLIC_* are compiled into the browser bundle, so the public URL
          # must be supplied at build time. Ignored by the api image.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.SITE_URL }}/api
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_CLIENT_ID=${{ vars.APPLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    # Only auto-deploy when the build ran against main (a manual dispatch
    # against another branch/tag still builds images but skips this).
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH and run ./deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # Ignored server-side if authorized_keys forces the command (see comment above),
          # kept here so the workflow is still correct if that restriction is ever lifted.
          script: |
            cd /srv/truoffers
            ./deploy.sh
          # deploy.sh itself waits up to 7 minutes for services to report healthy.
          command_timeout: 15m
