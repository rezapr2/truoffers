name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: mongodb://localhost:27017/truoffers_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Builds the api, worker and web images and drives the scraper flows against fixture websites on an
  # isolated Docker network (scripts/e2e-phase*.sh). No real website is contacted. The second run
  # reuses the image layers the first one built.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/e2e-phase1.sh
      - run: scripts/e2e-phase2.sh
      - run: scripts/e2e-phase3.sh
